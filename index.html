<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momoooc 导航</title>
    <link rel="stylesheet" href="web_conf/style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="header">
        <h1 class="title">Momoooc 导航</h1>
        <p class="subtitle">老墨的常用网站资源整合平台</p>
      </div>

      <div class="search-container">
        <div class="search-wrapper">
          <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="搜索网站名称或描述..."
          />
          <div class="search-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
        </div>
      </div>

      <div class="content-container">
        <div class="website-scroller" id="websiteScroller">
          <div class="grid-container" id="websiteContainer"></div>
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">🔍</div>
            <div class="empty-text">未找到匹配的网站</div>
          </div>
        </div>
      </div>
    </div>
    <script src="web_conf/script.js"></script>
  </body>
</html>
